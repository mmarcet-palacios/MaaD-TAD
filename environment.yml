# conda env create -f environment.yml    then    conda activate chromatin
# Versions are those used for the paper where the paper states them (Materials and methods).
name: chromatin
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy=1.26.4
  - scipy=1.17.1
  - matplotlib=3.10.9
  - pillow=12.2.0
  - h5py=3.16.0
  - biopython=1.88
  - gemmi
  - autograd
  - requests
  - certifi
  - pymol-open-source
  - pip
  - pip:
      - parasail==1.3.4
      - mappy==2.31
      - pyliftover
      - pyjaspar
      - hic-straw
